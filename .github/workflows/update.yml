name: Actualizar dashboard (nube)

on:
  schedule:
    # GitHub usa hora UTC. Cubrimos verano e invierno de Madrid con 4 disparos;
    # el "portero" de abajo deja pasar solo las 9:00 y las 21:00 hora de Madrid.
    - cron: "0 7,8,19,20 * * *"
  workflow_dispatch:   # permite lanzarlo a mano desde la pestaña Actions

jobs:
  # Portero: decide si esta pasada corresponde a las 9:00 o 21:00 en Madrid.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          H=$(TZ=Europe/Madrid date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$H" = "09" ] || [ "$H" = "21" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Toca ejecutar (hora Madrid: $H)."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No toca (hora Madrid: $H). Salgo sin hacer nada."
          fi

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install --quiet openpyxl google-api-python-client google-auth

      - name: Descargar los Excel desde Google Drive
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          PESO_FILE_ID: "19NR6iJRXrNteiXqAMop20VxorPZmE8nB"
          ENTRENO_FILE_ID: "17Yx2EMqe4QwbVnXgexmwSFoiWTYtBYyb"
        run: python3 scripts/fetch_drive.py

      - name: Regenerar los datos
        run: |
          python3 scripts/build_data.py    "data_src/Peso.xlsx"    data/peso.json
          python3 scripts/build_deporte.py "data_src/Entreno.xlsx" data/deporte.json
          python3 scripts/build_dieta.py   "data_src/Peso.xlsx"    data/dieta.json

      - name: Publicar solo si cambia un dato real
        run: |
          git add data/*.json
          if git diff --cached --quiet -- data/*.json; then
            echo "Sin cambios, nada que publicar."
            exit 0
          fi
          # ¿El único cambio es la hora (generated_at)? Entonces no publicamos.
          CAMBIOS=$(git diff --cached -U0 -- data/*.json \
            | grep -E '^[+-]' | grep -vE '^[+-]{3}' | grep -v '"generated_at"' | wc -l | tr -d ' ')
          if [ "$CAMBIOS" -eq 0 ]; then
            echo "Solo cambió la hora; no publico."
            git reset -- data/*.json
            exit 0
          fi
          git config user.name "health-dashboard bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Actualización automática en la nube ($(TZ=Europe/Madrid date '+%F %H:%M'))"
          git push
