<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0c0d">
<title>Salud · Peso</title>
<style>
  :root{
    --bg:#0a0c0d; --surface:#141719; --surface-2:#1b1f22; --line:#242a2e;
    --ink:#ffffff; --ink-2:#aab2b8; --ink-3:#6c757c;
    --accent:#25e0ab; --up:#f4a13c; --down:#25e0ab; --radius:20px;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  body{max-width:480px;margin:0 auto;padding:22px 18px 40px;min-height:100vh}
  .topbar{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px}
  .topbar .title{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
  .topbar .month{font-size:13px;color:var(--ink-3);letter-spacing:.02em}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}
  .card + .card{margin-top:14px}
  .hero{display:flex;flex-direction:column;gap:2px;align-items:flex-start;
    background:radial-gradient(120% 140% at 100% 0%, #16211f 0%, var(--surface) 55%)}
  .hero .lbl{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .hero .value{display:flex;align-items:baseline;gap:8px;margin-top:6px}
  .hero .num{font-size:64px;font-weight:650;line-height:1;letter-spacing:-.02em}
  .hero .unit{font-size:20px;color:var(--ink-2);font-weight:600}
  .hero .sub{font-size:13px;color:var(--ink-3);margin-top:10px}
  .chips{display:flex;gap:10px;margin-top:16px}
  .chip{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:11px 13px}
  .chip .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .chip .v{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:19px;font-weight:650}
  .chip .arrow{font-size:13px}
  .v.up{color:var(--up)} .v.down{color:var(--down)}
  .week-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .week-head .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .week-head .v{display:flex;align-items:center;gap:5px;font-size:15px;font-weight:650;white-space:nowrap}
  .week-head .v .arrow{font-size:11px}
  .week-main{display:flex;align-items:baseline;justify-content:space-between;margin-top:12px}
  .wnum{font-size:38px;font-weight:650;letter-spacing:-.02em}
  .wnum .wunit{font-size:15px;color:var(--ink-2);font-weight:600;margin-left:5px}
  .wthisn{font-size:11px;color:var(--ink-3);margin-top:4px}
  .wprev{font-size:12px;color:var(--ink-3);text-align:right}
  .wprev b{color:var(--ink-2);font-weight:650}
  .wprev span{display:block;font-size:10px;color:var(--ink-3);opacity:.8;margin-top:2px}
  .chart-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
  .chart-head .h{font-size:14px;font-weight:600;color:var(--ink)}
  .chart-head .legend{font-size:12px;color:var(--ink-3)}
  svg{display:block;width:100%;height:auto;overflow:visible}
  .grid line{stroke:var(--line);stroke-width:1}
  .area{fill:url(#g)}
  .trend{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
  .dot{fill:var(--bg);stroke:var(--accent);stroke-width:2}
  .dot-last{fill:var(--accent);stroke:var(--bg);stroke-width:2.5}
  .stats{display:flex;gap:10px}
  .stat{flex:1;text-align:center}
  .stat .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .stat .v{font-size:22px;font-weight:650;margin-top:6px;font-variant-numeric:tabular-nums}
  .stat + .stat{border-left:1px solid var(--line)}
  .foot{margin-top:18px;text-align:center;font-size:11px;color:var(--ink-3)}
  .err{color:var(--ink-2);text-align:center;padding:40px 20px;font-size:14px}
</style>
</head>
<body>
  <div class="topbar">
    <div class="title">Salud · Peso</div>
    <div class="month" id="month">—</div>
  </div>

  <div class="card hero">
    <div class="lbl">Peso de hoy</div>
    <div class="value"><span class="num" id="cur">—</span><span class="unit">kg</span></div>
    <div class="sub" id="cursub">—</div>
    <div class="chips">
      <div class="chip"><div class="k">vs ayer</div><div class="v" id="dprev">—</div></div>
      <div class="chip"><div class="k">vs hace 7 días</div><div class="v" id="dweek">—</div></div>
    </div>
  </div>

  <div class="card week">
    <div class="week-head">
      <div class="k">Media semanal</div>
      <div class="v" id="wdelta">—</div>
    </div>
    <div class="week-main">
      <div>
        <div class="wnum"><span id="wthis">—</span><span class="wunit">kg</span></div>
        <div class="wthisn" id="wthisn"></div>
      </div>
      <div class="wprev">semana pasada <b id="wlast">—</b> kg<span id="wlastn"></span></div>
    </div>
  </div>

  <div class="card">
    <div class="chart-head"><div class="h">Tendencia del mes</div><div class="legend" id="range">—</div></div>
    <div id="chart"></div>
  </div>

  <div class="card stats">
    <div class="stat"><div class="k">Mínimo</div><div class="v" id="min">—</div></div>
    <div class="stat"><div class="k">Media</div><div class="v" id="avg">—</div></div>
    <div class="stat"><div class="k">Máximo</div><div class="v" id="max">—</div></div>
  </div>

  <div class="foot" id="foot">—</div>

<script>
const fmt = (n,d=1) => (n>0?"+":"") + n.toFixed(d);
const dias = n => n+' día'+(n===1?'':'s');
function setDelta(id, val, dec=1){
  const el = document.getElementById(id);
  if(val===null||val===undefined){el.textContent="—";return;}
  const down = val < 0;
  el.className = "v " + (down?"down":"up");
  el.innerHTML = '<span class="arrow">'+(down?'▼':'▲')+'</span>'+fmt(val,dec)+' kg';
}

fetch('./data/peso.json?v=' + Date.now())
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(err => {
    document.body.innerHTML = '<div class="err">No se pudieron cargar los datos de peso.<br>('+err+')</div>';
    console.error(err);
  });

function render(DATA){
  document.getElementById('month').textContent = DATA.month;
  if(!DATA.current){
    document.getElementById('cur').textContent = '—';
    return;
  }
  document.getElementById('cur').textContent = DATA.current.weight.toFixed(1);
  document.getElementById('cursub').textContent = 'Hoy · día '+DATA.current.day;
  setDelta('dprev', DATA.delta_vs_previous);
  setDelta('dweek', DATA.delta_vs_week);

  document.getElementById('min').textContent = DATA.stats.min.toFixed(1);
  document.getElementById('avg').textContent = DATA.stats.avg.toFixed(1);
  document.getElementById('max').textContent = DATA.stats.max.toFixed(1);
  document.getElementById('range').textContent = 'días '+DATA.series[0].day+'–'+DATA.series[DATA.series.length-1].day;

  const d = new Date(DATA.generated_at);
  document.getElementById('foot').textContent = 'Actualizado '+d.toLocaleDateString('es-ES',{day:'numeric',month:'long'})+
    ' · '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});

  // Bloque semana (medias por semana natural, 2 decimales)
  if(DATA.week && DATA.week.this && DATA.week.this.avg!==null){
    document.getElementById('wthis').textContent = DATA.week.this.avg.toFixed(2);
    document.getElementById('wthisn').textContent = 'esta semana · '+dias(DATA.week.this.count);
    if(DATA.week.last.avg!==null){
      document.getElementById('wlast').textContent = DATA.week.last.avg.toFixed(2);
      document.getElementById('wlastn').textContent = dias(DATA.week.last.count);
      setDelta('wdelta', DATA.week.delta, 2);
    } else {
      document.getElementById('wlast').textContent = '—';
      document.getElementById('wdelta').textContent = '';
    }
  }

  // Gráfica SVG
  const S = DATA.series;
  const W=440, H=190, padL=30, padR=12, padT=14, padB=24;
  const xs = S.map(p=>p.day), ys = S.map(p=>p.weight);
  const xMin=Math.min(...xs), xMax=Math.max(...xs);
  let yMin=Math.min(...ys), yMax=Math.max(...ys);
  const pad=(yMax-yMin)*0.35 || 1; yMin=Math.floor((yMin-pad)*2)/2; yMax=Math.ceil((yMax+pad)*2)/2;
  const X = v => padL + (v-xMin)/((xMax-xMin)||1)*(W-padL-padR);
  const Y = v => padT + (yMax-v)/((yMax-yMin)||1)*(H-padT-padB);
  const pts = S.map(p=>[X(p.day),Y(p.weight)]);
  const line = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area = line+` L${X(xMax).toFixed(1)} ${(H-padB)} L${X(xMin).toFixed(1)} ${(H-padB)} Z`;
  let gy='';
  for(let i=0;i<=2;i++){
    const v=yMin+(yMax-yMin)*i/2, y=Y(v);
    gy+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}"/>`;
    gy+=`<text x="0" y="${(y+3).toFixed(1)}" class="tk">${v.toFixed(1)}</text>`;
  }
  let gx='';
  [xMin, Math.round((xMin+xMax)/2), xMax].forEach(dv=>{
    if(dv<xMin||dv>xMax) return;
    gx+=`<text x="${X(dv).toFixed(1)}" y="${H-6}" text-anchor="middle" class="tk">${dv}</text>`;
  });
  const dots = S.map((p,i)=>{
    const last = i===S.length-1;
    return `<circle cx="${X(p.day).toFixed(1)}" cy="${Y(p.weight).toFixed(1)}" r="${last?5:3.2}" class="${last?'dot-last':'dot'}"/>`;
  }).join('');
  document.getElementById('chart').innerHTML = `
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tendencia de peso del mes">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient></defs>
    <style>.tk{fill:var(--ink-3);font-size:10px;font-family:system-ui}</style>
    <g class="grid">${gy}</g><g>${gx}</g>
    <path class="area" d="${area}"/><path class="trend" d="${line}"/>${dots}
  </svg>`;
}
</script>
</body>
</html>
